[package]
name = "dj"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
cpal = "0.16"
symphonia = { version = "0.5.5", features = ["all"] }
hound = "3.5"
walkdir = "2.5"
dirs = "6"
rfd = "0.15"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt"] }
chrono = "0.4"
parking_lot = "0.12"
base64 = "0.22"

# Audio decoding/analysis is painfully slow unoptimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
